name: Naya vyakti sujhayein
description: Code ke bina kisi vyakti ko vanshavali me jodne ka sujhav dein
title: "Naya vyakti: "
labels: ["data"]
body:
  - type: input
    id: name
    attributes:
      label: Naam
      placeholder: Vyakti ka naam
    validations:
      required: true
  - type: input
    id: parent
    attributes:
      label: Pita / mool vyakti (jo vriksh me pehle se hai)
      placeholder: "Jaise: Kush (Shri Ram ke putra)"
    validations:
      required: true
  - type: input
    id: vansh
    attributes:
      label: Vansh
      placeholder: Suryavansh
  - type: input
    id: family
    attributes:
      label: Mata, patni ya pati (agar pata ho)
  - type: textarea
    id: about
    attributes:
      label: Sankshipt jaankari
      description: Kaun the, kis liye jaane jaate hain
  - type: textarea
    id: source
    attributes:
      label: Source (zaroori)
      description: Granth ka naam aur adhyay/shlok. Bina source ke sujhav nahi joda ja sakta.
      placeholder: "Granth, adhyay/shlok (jaise: Bhagavata Purana 9.12)"
    validations:
      required: true
